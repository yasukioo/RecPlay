<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RecPlay Trajectory Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(17, 25, 46, 0.92);
      --panel-2: rgba(23, 34, 61, 0.95);
      --line: rgba(148, 163, 184, 0.2);
      --text: #e5eefc;
      --muted: #93a4c7;
      --accent: #6ee7ff;
      --accent-2: #89f7a1;
      --warn: #ffd166;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(110, 231, 255, 0.14), transparent 24%),
        radial-gradient(circle at 90% 0%, rgba(137, 247, 161, 0.12), transparent 22%),
        linear-gradient(180deg, #08101d 0%, #0b1020 100%);
    }
    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) 360px;
      gap: 16px;
      padding: 16px;
      min-height: 100vh;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(12px);
    }
    .map-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 680px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    }
    .title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .subtitle {
      color: var(--muted);
      font-size: 12px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      font-size: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f87171;
      box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.15);
    }
    #chart {
      flex: 1;
      min-height: 560px;
    }
    .sidebar {
      display: grid;
      gap: 16px;
      align-content: start;
    }
    .card {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--panel-2);
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .metric {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148,163,184,0.12);
    }
    .metric-label {
      font-size: 12px;
      color: var(--muted);
    }
    .metric-value {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 700;
    }
    .hint {
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
    }
    .log {
      max-height: 250px;
      overflow: auto;
      display: grid;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .log-item {
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148,163,184,0.08);
    }
    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
      }
      .map-panel {
        min-height: 560px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel map-panel">
      <div class="topbar">
        <div class="title">
          <h1>RecPlay Trajectory Viewer</h1>
          <div class="subtitle">实时 UDP 航迹显示，兼容录制段与回放段</div>
        </div>
        <div class="status" id="status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Disconnected</span>
        </div>
      </div>
      <div id="chart"></div>
    </section>

    <aside class="sidebar">
      <section class="card">
        <h2>Connection</h2>
        <div class="hint" id="connectionHint">Connecting to ws://localhost:8765 ...</div>
      </section>
      <section class="card">
        <h2>Latest Packet</h2>
        <div class="metrics">
          <div class="metric">
            <div class="metric-label">Flight</div>
            <div class="metric-value" id="flightId">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Seq</div>
            <div class="metric-value" id="seq">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Altitude</div>
            <div class="metric-value" id="alt">-</div>
          </div>
          <div class="metric">
            <div class="metric-label">Speed</div>
            <div class="metric-value" id="spd">-</div>
          </div>
        </div>
      </section>
      <section class="card">
        <h2>Packet Log</h2>
        <div class="log" id="log"></div>
      </section>
      <section class="card">
        <h2>Usage</h2>
        <div class="hint">
          先运行 bridge，再打开这个页面。模拟器或回放重新发送相同 UDP 数据报后，航迹会在图上继续延伸。
        </div>
      </section>
    </aside>
  </div>

  <script>
    const wsUrl = "ws://localhost:8765";
    const chart = echarts.init(document.getElementById("chart"), null, { renderer: "canvas" });
    const points = [];
    const raw = [];

    const option = {
      backgroundColor: "transparent",
      grid: { left: 48, right: 28, top: 36, bottom: 48 },
      tooltip: { trigger: "axis" },
      xAxis: {
        type: "value",
        name: "Lon",
        nameTextStyle: { color: "#93a4c7" },
        axisLine: { lineStyle: { color: "#38506f" } },
        axisLabel: { color: "#93a4c7" },
        splitLine: { lineStyle: { color: "rgba(148,163,184,0.12)" } },
      },
      yAxis: {
        type: "value",
        name: "Lat",
        nameTextStyle: { color: "#93a4c7" },
        axisLine: { lineStyle: { color: "#38506f" } },
        axisLabel: { color: "#93a4c7" },
        splitLine: { lineStyle: { color: "rgba(148,163,184,0.12)" } },
      },
      series: [
        {
          type: "line",
          data: points,
          showSymbol: false,
          smooth: true,
          lineStyle: { width: 3, color: "#6ee7ff" },
          areaStyle: { color: "rgba(110,231,255,0.12)" },
          emphasis: { disabled: true },
          markPoint: {
            symbol: "circle",
            symbolSize: 12,
            itemStyle: { color: "#89f7a1" },
            data: [{ name: "Current", coord: [0, 0] }],
          },
        },
      ],
    };
    chart.setOption(option);

    function setStatus(online, text) {
      document.getElementById("statusText").textContent = text;
      document.getElementById("statusDot").style.background = online ? "#89f7a1" : "#f87171";
      document.getElementById("statusDot").style.boxShadow = online
        ? "0 0 0 4px rgba(137, 247, 161, 0.16)"
        : "0 0 0 4px rgba(248, 113, 113, 0.15)";
      document.getElementById("connectionHint").textContent = online
        ? `Connected to ${wsUrl}`
        : text;
    }

    function pushLog(message) {
      const log = document.getElementById("log");
      const item = document.createElement("div");
      item.className = "log-item";
      item.textContent = message;
      log.prepend(item);
      while (log.children.length > 30) {
        log.removeChild(log.lastChild);
      }
    }

    function updateMetrics(packet) {
      document.getElementById("flightId").textContent = packet.id ?? "-";
      document.getElementById("seq").textContent = packet.seq ?? "-";
      document.getElementById("alt").textContent = `${Number(packet.alt_m ?? 0).toFixed(1)} m`;
      document.getElementById("spd").textContent = `${Number(packet.spd_kt ?? 0).toFixed(1)} kt`;
    }

    function updateChart(packet) {
      const x = Number(packet.lon);
      const y = Number(packet.lat);
      if (!Number.isFinite(x) || !Number.isFinite(y)) {
        return;
      }
      points.push([x, y]);
      raw.push(packet);
      chart.setOption({
        series: [
          {
            data: points,
            markPoint: {
              data: [{ name: "Current", coord: [x, y] }],
            },
          },
        ],
      });
      chart.resize();
    }

    function connect() {
      setStatus(false, "Connecting...");
      const socket = new WebSocket(wsUrl);

      socket.addEventListener("open", () => {
        setStatus(true, "Connected");
        pushLog("WebSocket connected.");
      });

      socket.addEventListener("message", (event) => {
        try {
          const packet = JSON.parse(event.data);
          updateMetrics(packet);
          updateChart(packet);
          pushLog(`${packet.id} #${packet.seq} @ ${Number(packet.lat).toFixed(4)}, ${Number(packet.lon).toFixed(4)}`);
        } catch (error) {
          pushLog(`Invalid payload: ${String(error)}`);
        }
      });

      socket.addEventListener("close", () => {
        setStatus(false, "Disconnected");
        pushLog("WebSocket disconnected. Reconnecting in 1s...");
        setTimeout(connect, 1000);
      });

      socket.addEventListener("error", () => {
        setStatus(false, "Connection error");
      });
    }

    window.addEventListener("resize", () => chart.resize());
    connect();
  </script>
</body>
</html>
